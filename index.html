<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="林芳誠建築師事務所名片分類資料庫">
  <title>名片資料庫｜林芳誠建築師事務所</title>
  <style>
    :root{--concrete:#d5d2cb;--ink:#262a29;--muted:#686d69;--line:#949790;--paper:rgba(247,245,239,.93);--accent:#8d312d;--accent-dark:#64211f;--shadow:0 20px 55px rgba(31,34,31,.14)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:radial-gradient(circle at 15% 18%,rgba(255,255,255,.35) 0 1px,transparent 2px),radial-gradient(circle at 78% 38%,rgba(70,72,68,.12) 0 1px,transparent 2px),linear-gradient(115deg,rgba(255,255,255,.23),transparent 42%),var(--concrete);background-size:31px 29px,43px 41px,100% 100%,auto;min-height:100vh}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:repeating-linear-gradient(0deg,transparent 0 97px,rgba(57,60,56,.08) 98px),repeating-linear-gradient(90deg,transparent 0 154px,rgba(255,255,255,.10) 155px);mix-blend-mode:multiply}
    .shell{width:min(1180px,calc(100% - 40px));margin:0 auto;position:relative}
    header{padding:72px 0 42px;border-bottom:1px solid rgba(44,48,45,.45)}
    .eyebrow{margin:0 0 22px;color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:0;max-width:760px;font-family:"Noto Serif TC","PMingLiU",serif;font-size:clamp(2.35rem,6vw,5.8rem);line-height:.98;font-weight:600;letter-spacing:-.04em}
    .intro{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:28px;margin-top:30px}
    .intro p{max-width:660px;margin:0;color:#4d524f;line-height:1.8}.total{color:var(--muted);font-size:.86rem;letter-spacing:.1em;white-space:nowrap}
    main{padding:34px 0 80px}
    .controls{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:16px;padding:14px 0;background:linear-gradient(var(--concrete),rgba(213,210,203,.94));backdrop-filter:blur(10px)}
    .search{width:100%;border:1px solid #777d78;border-radius:0;background:rgba(245,243,237,.72);color:var(--ink);padding:14px 16px;font:inherit;outline:none}
    .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(141,49,45,.12)}
    .tabs{display:flex;flex-wrap:wrap;gap:8px}.tab{border:1px solid #777d78;background:transparent;color:var(--ink);padding:11px 16px;cursor:pointer;font:inherit;font-weight:700;transition:.2s ease}
    .tab:hover,.tab.active{background:var(--ink);color:#f7f4ed;border-color:var(--ink)}.tab span{margin-left:7px;opacity:.65;font-size:.78em}
    .result-line{display:flex;justify-content:space-between;gap:20px;margin:24px 0 16px;color:var(--muted);font-size:.82rem;letter-spacing:.06em}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{position:relative;overflow:hidden;min-height:330px;padding:26px;background:var(--paper);border:1px solid rgba(48,53,49,.48);box-shadow:var(--shadow)}
    .card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--accent)}
    .card-head{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:start}
    .index{width:54px;height:54px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);font:700 .75rem/1 Arial,sans-serif;letter-spacing:.08em}
    h2{margin:0;font-family:"Noto Serif TC","PMingLiU",serif;font-size:1.55rem;font-weight:700}.company{margin:6px 0 0;color:#555b57;line-height:1.45}
    .badge{border:1px solid var(--accent);color:var(--accent-dark);padding:5px 8px;font-size:.7rem;font-weight:800;letter-spacing:.08em}
    .role{margin:20px 0 0 68px;min-height:1.5em;color:#5b615d;font-size:.9rem}
    dl{display:grid;grid-template-columns:88px minmax(0,1fr);gap:0;margin:22px 0 0;border-top:1px solid var(--line)}
    dt,dd{margin:0;padding:10px 0;border-bottom:1px solid rgba(118,124,118,.32)}dt{color:var(--muted);font-size:.75rem;letter-spacing:.05em}dd{word-break:break-word;line-height:1.55}
    a{color:var(--accent-dark);text-underline-offset:3px}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
    .action{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 13px;border:1px solid #747a75;color:var(--ink);text-decoration:none;font-size:.82rem;font-weight:700}
    .action:hover{background:var(--ink);color:white}details{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}summary{cursor:pointer;color:var(--muted);font-size:.82rem;font-weight:700}
    .notes{margin:12px 0 0;color:#555b57;line-height:1.7;font-size:.84rem}.warning{margin-top:13px;padding:10px 12px;background:#f4e4bb;color:#6b4a10;font-size:.8rem;line-height:1.55}
    .photo-preview{display:block;width:100%;border:1px solid var(--line);background:#e7e5df;padding:12px;text-decoration:none;color:var(--muted)}
    .photo-preview img{display:block;width:100%;height:160px;object-fit:contain;background:#f5f3ee}
    .photo-preview span{display:block;margin-top:10px;font-size:.78rem;letter-spacing:.06em}
    .photo-preview:hover,.photo-preview:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
    .empty{grid-column:1/-1;padding:50px;border:1px solid #7e827d;text-align:center;background:rgba(245,243,237,.55)}
    footer{border-top:1px solid rgba(44,48,45,.45);padding:28px 0 50px;color:var(--muted);font-size:.8rem}
    @media(max-width:820px){.shell{width:min(100% - 24px,680px)}header{padding-top:50px}.intro,.controls{grid-template-columns:1fr}.controls{position:static}.grid{grid-template-columns:1fr}.total{white-space:normal}}
    @media(max-width:480px){h1{font-size:2.7rem}.card{padding:20px}.card-head{grid-template-columns:44px 1fr}.index{width:44px;height:44px}.badge{grid-column:2;width:max-content}.role{margin-left:58px}dl{grid-template-columns:72px minmax(0,1fr)}}
  </style>
</head>
<body>
  <header><div class="shell">
    <p class="eyebrow">Lin Fang Cheng Architects · Contact Archive</p>
    <h1>名片<br>資料庫</h1>
    <div class="intro">
      <p>將散落名片整理為客戶、營造廠與建築師三類。可依姓名、公司、電話、Email 或地址搜尋；原始名片照片保留於每筆資料中供核對。</p>
      <div class="total">整理日期 2026.11.15　／　共 9 筆</div>
    </div>
  </div></header>
  <main class="shell">
    <section class="controls" aria-label="名片篩選">
      <input class="search" id="search" type="search" placeholder="搜尋姓名、公司、電話、Email、地址…" autocomplete="off">
      <div class="tabs" role="tablist" aria-label="分類">
        <button class="tab active" type="button" data-category="全部">全部<span>9</span></button>
        <button class="tab" type="button" data-category="客戶">客戶<span>6</span></button>
        <button class="tab" type="button" data-category="營造廠">營造廠<span>0</span></button>
        <button class="tab" type="button" data-category="建築師">建築師<span>3</span></button>
      </div>
    </section>
    <div class="result-line"><span id="resultCount">顯示 9 筆</span><span>點選聯絡方式可直接開啟</span></div>
    <section class="grid" id="cards" aria-live="polite"></section>
  </main>
  <footer><div class="shell">林芳誠建築師事務所　名片資料僅供事務所業務聯絡與歸檔使用。</div></footer>
  <script>
    const contacts=[
      {category:'客戶',id:'001',name:'陳紀妍',company:'南山人壽保險股份有限公司',role:'業務主任／竹中通訊處',phone:'03-5311107',mobile:'0925-158-568',email:'dan789g@yahoo.com.tw',address:'30054 新竹市東大路二段110號5樓之2',website:'http://www.nanshanlife.com.tw',fax:'03-5311436',taxId:'11456006',basis:'原教材歸於業主，對應客戶',notes:'',photo:'Scan20260511_183043(1).jpg'},
      {category:'客戶',id:'002',name:'吳文忠（育丞）',company:'台灣自來水公司第二區管理處',role:'副處長',phone:'03-4643131 分機202',mobile:'0912-223257',email:'h485@mail.water.gov.tw',address:'324 桃園市平鎮區水廠路150號',website:'',fax:'03-4643135',taxId:'',basis:'原教材歸於業主，對應客戶',notes:'',photo:'Scan20260511_183043(2).jpg'},
      {category:'客戶',id:'003',name:'謝欣雄',company:'KoMiCo Technology Taiwan Ltd.',role:'資深廠務經理／管理部',phone:'03-5972988 分機123',mobile:'0933-976-646',email:'Jason.Hsieh@komico.com',address:'303 新竹縣湖口鄉實踐路14號',website:'http://www.komico.com',fax:'03-5972188',taxId:'28124684',basis:'原教材歸於業主，對應客戶',notes:'',photo:'Scan20260511_183043(3).jpg'},
      {category:'客戶',id:'004',name:'龔榮堂',company:'國立體育大學',role:'體育長／Professor & Director',phone:'03-3283201 分機5005',mobile:'0921-336730',email:'kung@ntsu.edu.tw',address:'333325 桃園市龜山區文化一路250號',website:'',fax:'03-3972904',taxId:'02612744',basis:'原教材歸於業主，對應客戶',notes:'英文姓名：Kung, Jung-Tang',photo:'Scan20260511_183043(5).jpg'},
      {category:'建築師',id:'005',name:'（待查）',company:'九福建築師事務所',role:'',phone:'05-5328108',mobile:'',email:'joefu.archi@gmail.com',address:'雲林縣斗六市成功路569號',website:'',fax:'05-5321108',taxId:'38913272',basis:'依名片所載建築師事務所分類',notes:'照片未印個人姓名；英文名稱：JOE FU ARCHITECTURE。',photo:'Scan20260512_102051(1).jpg'},
      {category:'建築師',id:'006',name:'江堅龍',company:'江堅龍建築師事務所',role:'',phone:'02-87973567 分機2539',mobile:'',email:'clc25@ceci.com.tw',address:'台北市內湖區陽光街323號1樓',website:'',fax:'02-87973276',taxId:'',basis:'依名片所載建築師事務所分類',notes:'',photo:'Scan20260512_102051(2).jpg'},
      {category:'建築師',id:'007',name:'蔡仁毅',company:'福建金門馬祖地區建築師公會／蔡仁毅建築師事務所',role:'鑑定委員會主任委員／事務所負責人',phone:'082-328712（公會）；02-23458707（事務所）',mobile:'0937-911858',email:'jybear.tsai@msa.hinet.net',address:'公會：89350 金門縣金城鎮民權路226巷4弄22號4樓；事務所：110 台北市信義區和平東路3段323號7樓',website:'',fax:'082-328713（公會）；02-23458707（事務所）',taxId:'77355036',basis:'依名片所載公會及建築師事務所分類',notes:'統一編號為公會。',photo:'Scan20260512_102051(3).jpg'},
      {category:'客戶',id:'008',name:'俞翰蒼',company:'詮力實業股份有限公司',role:'一級專員',phone:'02-27268558',mobile:'0972-061551',email:'ji394su3@chuanli.com.tw',address:'110 台北市信義區松德路161號11樓之1',website:'',fax:'02-27268158',taxId:'43794487',basis:'暫列客戶，分類待確認',notes:'名片未標示營造業或建築師資格；手寫註記未用於判定職業。',photo:'Scan20260512_102051(4).jpg',pending:true},
      {category:'客戶',id:'009',name:'鄭子傑',company:'傳真機構',role:'副總經理',phone:'02-27771288',mobile:'0931-393717',email:'chengtzuchieh@gmail.com',address:'台北市市民大道四段100號15樓',website:'',fax:'02-27771211',taxId:'',basis:'暫列客戶，分類待確認',notes:'名片標示專業建築代銷；列有傳真實業、傳美廣告、傳捷廣告、傳陽建設、傳豐投資。',photo:'Scan20260512_102051(5).jpg',pending:true}
    ];
    const cards=document.querySelector('#cards'),search=document.querySelector('#search'),resultCount=document.querySelector('#resultCount');
    let activeCategory='全部';
    const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const phoneHref=value=>String(value||'').replace(/[^0-9+]/g,'');
    const detail=(label,value,link)=>value?'<dt>'+label+'</dt><dd>'+(link?'<a href="'+link+'">'+esc(value)+'</a>':esc(value))+'</dd>':'';
    function render(){
      const q=search.value.trim().toLowerCase();
      const filtered=contacts.filter(c=>(activeCategory==='全部'||c.category===activeCategory)&&(!q||Object.values(c).join(' ').toLowerCase().includes(q)));
      resultCount.textContent='顯示 '+filtered.length+' 筆';
      if(!filtered.length){cards.innerHTML='<div class="empty">此分類目前沒有符合條件的名片。</div>';return}
      cards.innerHTML=filtered.map(c=>'<article class="card"><div class="card-head"><div class="index">'+esc(c.id)+'</div><div><h2>'+esc(c.name)+'</h2><p class="company">'+esc(c.company)+'</p></div><span class="badge">'+esc(c.category)+'</span></div><p class="role">'+esc(c.role)+'</p><dl>'+detail('行動電話',c.mobile,c.mobile?'tel:'+phoneHref(c.mobile):'')+detail('電話',c.phone,c.phone?'tel:'+phoneHref(c.phone):'')+detail('Email',c.email,c.email?'mailto:'+esc(c.email):'')+detail('地址',c.address,'')+'</dl><div class="actions">'+(c.website?'<a class="action" href="'+esc(c.website)+'" target="_blank" rel="noopener">公司網站</a>':'')+'<a class="photo-preview" href="photos/'+encodeURIComponent(c.photo)+'" target="_blank" rel="noopener" aria-label="查看原始名片大圖"><img src="photos/'+encodeURIComponent(c.photo)+'" alt="'+esc(c.name)+'的原始名片" loading="lazy" decoding="async"><span>原始名片 · 點選放大 ↗</span></a></div><details><summary>更多歸檔資料</summary><p class="notes">分類依據：'+esc(c.basis)+'<br>傳真：'+(esc(c.fax)||'—')+'<br>統一編號：'+(esc(c.taxId)||'—')+(c.notes?'<br>備註：'+esc(c.notes):'')+'</p>'+(c.pending?'<div class="warning">此筆分類待確認，請依後續往來關係調整。</div>':'')+'</details></article>').join('');
    }
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(item=>item.classList.remove('active'));button.classList.add('active');activeCategory=button.dataset.category;render()}));
    search.addEventListener('input',render);render();
  </script>
</body>
</html>
